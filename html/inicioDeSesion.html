<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MateBeat · Inicia sesión</title>
    <link rel="stylesheet" href="../css/styles.css">
    </head>
    <body class="pantalla-centrada">
    <main class="tarjeta-auth">
        <img src="../assets/logo_m8beat.png" alt="Logo MateBeat - Música y Amigos" class="logo-auth">
        
        <h1 class="titulo-auth">Inicia sesión</h1>
        <p class="subtitulo-auth">¡Disfruta de la música como nunca antes!</p>

        <form action="../index.html" class="formulario-auth">
        <div class="campo-grupo">
            <label for="email-login">Email/usuario</label>
            <input type="text" id="email-login" name="email" placeholder="tucorreo@gmail.com">
        </div>

        <div class="campo-grupo">
            <label for="password-login">Contraseña</label>
            <input type="password" id="password-login" name="password" placeholder="••••••••••••">
        </div>

        <button type="submit" class="btn btn-primario btn-ancho">¡Vamos!</button>
        </form>

        <p class="pie-auth">
        ¿Aún no tienes cuenta? <a href="registro.html">Regístrate</a>
        </p>
    </main>
</body>
</html>
